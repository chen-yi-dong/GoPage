name: Docker Image CI

# 触发条件：
#   * push 到 main            -> 构建并推送（标签：latest、main、commit sha）
#   * push v* 标签（如 v1.0.14）-> 构建并推送（标签：1.0.14、1.0）
#   * Pull Request            -> 只构建不推送，用来验证 Dockerfile 没被改坏
#   * 手动触发                -> Actions 页面点 "Run workflow"
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # 镜像仓库：GitHub Container Registry（与仓库同账号，无需额外注册）
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 推送到 ghcr.io 需要这个权限

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ghcr.io 要求镜像名全小写，而仓库名是 "GoPage"（含大写），
      # 这里先把 github.repository 转成小写备用
      - name: 镜像名转小写
        run: echo "IMAGE_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # QEMU + Buildx：支持构建 arm64 等其它架构（树莓派 / ARM  NAS 可直接拉取）
      # 如果只在自己 x86 机器上跑，可删掉这两步和下面的 platforms 以加快构建
      - name: 安装 QEMU（多架构支持）
        uses: docker/setup-qemu-action@v3

      - name: 安装 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN 由 Actions 自动注入，不需要去 Settings 里配任何 Secret
          password: ${{ secrets.GITHUB_TOKEN }}

      # 自动生成镜像标签与 OCI Labels：
      #   main 分支 -> latest、main、sha-xxxxxx
      #   v1.0.14  -> 1.0.14、1.0、sha-xxxxxx
      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_LC }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}   # PR 只构建验证，不推送
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # 使用 GitHub Actions 缓存加速后续构建（层缓存，避免重复 pip install）
          cache-from: type=gha
          cache-to: type=gha,mode=max
